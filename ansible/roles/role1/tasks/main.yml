
---
- name: Prepare environment and deploy microservices
  tags:
    - start
  block:

    - name: Install Git, Docker and Docker Compose
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true
      notify: Restart Docker

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Apply Docker handlers
      ansible.builtin.meta: flush_handlers

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Clone backend repository
      ansible.builtin.git:
        repo: "{{ backend_repo }}"
        dest: "{{ app_dir }}/backend"
        version: "{{ app_branch }}"

    - name: Clone frontend repository
      ansible.builtin.git:
        repo: "{{ frontend_repo }}"
        dest: "{{ app_dir }}/frontend"
        version: "{{ app_branch }}"

    - name: Clone DevOps repository
      ansible.builtin.git:
        repo: "{{ devops_repo }}"
        dest: "{{ app_dir }}/DevOps"
        version: "{{ devops_branch }}"

    - name: Create data directory
      ansible.builtin.file:
        path: "{{ app_dir }}/DevOps/data"
        state: directory
        mode: '0755'

    - name: Build and start microservices
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ app_dir }}/DevOps"

- name: Stop microservices
  ansible.builtin.import_tasks: subtasks/subtask.yml
  tags:
    - never
    - stop

