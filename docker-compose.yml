services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: backend:2.0
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    networks:
      - app-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: frontend:2.0
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
